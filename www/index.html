<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Civil Lab Academy — 93 Test Procedures</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--text:#182230;--muted:#5a6778;--border:#dfe4ec;--primary:#14497a;--pl:#e8f1fa;--accent:#d98218;--warn-bg:#fff8e6;--warn-bd:#f0c36d;--ok:#157f4b;--sh:0 2px 10px rgba(16,28,46,.06)}
  [data-theme="dark"]{--bg:#0f1520;--card:#17202e;--text:#e6ecf5;--muted:#98a6b8;--border:#273347;--primary:#5aa3e8;--pl:#1c2f47;--accent:#f0a442;--warn-bg:#2a2212;--warn-bd:#7a5b22;--ok:#38b878;--sh:0 2px 12px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.48}
  header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.02rem;color:var(--primary);cursor:pointer}
  .badge{font-size:.72rem;background:var(--pl);color:var(--primary);padding:2px 8px;border-radius:99px;font-weight:600}
  .sw{flex:1;min-width:190px;max-width:420px;position:relative}
  .sw input{width:100%;padding:7px 28px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem}
  .sc{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;display:none}
  .tools{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:5px 10px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
  .tpill{display:inline-flex;align-items:center;gap:5px;background:var(--pl);color:var(--primary);padding:4px 9px;border-radius:8px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
  .tpill button{border:none;background:var(--card);color:var(--text);border-radius:4px;padding:2px 6px;cursor:pointer;font-size:.73rem;font-weight:600}
  .layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 54px)}
  aside{background:var(--card);border-right:1px solid var(--border);padding:12px;overflow-y:auto;max-height:calc(100vh - 54px);position:sticky;top:54px}
  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .pill{font-size:.74rem;padding:4px 8px;border-radius:99px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-weight:600}
  .pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .subsel{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.81rem;margin-bottom:8px}
  .tlist{display:flex;flex-direction:column;gap:4px}
  .titem{padding:7px 9px;border-radius:8px;border:1px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
  .titem:hover{background:var(--bg);border-color:var(--border)}
  .titem.active{background:var(--pl);border-color:var(--primary)}
  .tnum{min-width:25px;height:21px;border-radius:5px;background:var(--bg);border:1px solid var(--border);font-size:.73rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--primary)}
  .titem.active .tnum{background:var(--primary);color:#fff;border-color:var(--primary)}
  .tmeta{flex:1;min-width:0}
  .ttitle{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tstd{font-size:.71rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:18px 24px;max-width:1040px;width:100%;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
  .bc{font-size:.79rem;color:var(--muted);margin-bottom:4px}
  h1.title{margin:0 0 8px;font-size:1.42rem}
  .tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .stag{background:var(--pl);color:var(--primary);padding:3px 9px;border-radius:6px;font-size:.79rem;font-weight:700}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:7px 13px;border:none;background:none;color:var(--muted);font-weight:600;font-size:.86rem;cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
  .sbox{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px;text-align:center;margin-bottom:12px}
  .sbox svg{max-width:340px;width:100%;height:auto}
  .sh{font-size:.94rem;font-weight:700;color:var(--primary);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center}
  .clist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
  .clist li{display:flex;align-items:flex-start;gap:8px;font-size:.9rem;padding:4px 7px;border-radius:6px}
  .clist li:hover{background:var(--bg)}
  .clist input{margin-top:4px;width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
  .clist li.done span{text-decoration:line-through;color:var(--muted)}
  .pbar{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--border);margin-bottom:8px}
  .pfill{height:100%;background:var(--ok);width:0%;transition:width .2s}
  .wbox{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;padding:10px 13px}
  .wbox ul{margin:0;padding-left:18px}
  .wbox li{margin-bottom:4px;font-size:.88rem}
  .ccard{border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:10px;background:var(--bg)}
  .fcode{font-family:ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--border);padding:7px 9px;border-radius:6px;font-size:.85rem;margin:6px 0 9px;overflow-x:auto}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
  .fld label{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:2px}
  .fld input,.fld textarea{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:.86rem}
  .cres{margin-top:9px;padding:8px 11px;border-radius:7px;background:var(--pl);color:var(--primary);font-weight:700;font-size:.92rem}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
  .scard{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer}
  .scard:hover{border-color:var(--primary)}
  .sval{font-size:1.45rem;font-weight:800;color:var(--primary)}
  .slbl{font-size:.8rem;color:var(--muted);font-weight:600}
  .disc{font-size:.76rem;color:var(--muted);border-top:1px solid var(--border);padding-top:9px;margin-top:14px}
  .ptbl{width:100%;border-collapse:collapse;font-size:.82rem;margin:8px 0;background:var(--card)}
  .ptbl th,.ptbl td{border:1px solid var(--border);padding:5px 7px;text-align:right}
  .ptbl th{background:var(--pl);color:var(--primary);font-weight:700}
  .ptbl td:first-child,.ptbl th:first-child{text-align:left}
  .ptbl input{width:78px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);text-align:right;font-size:.82rem}
  .chartbox{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px}
  .chartbox svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
  .mbtn{display:none}
  @media(max-width:840px){
    .layout{grid-template-columns:1fr}
    aside{display:none;position:fixed;left:0;top:54px;bottom:0;width:85%;max-width:320px;z-index:60;box-shadow:4px 0 20px rgba(0,0,0,.25)}
    aside.open{display:block}
    .mbtn{display:inline-flex}
    main{padding:12px}
  }
  @media print{header,aside,.tabs,.np{display:none!important}.layout{display:block}main{max-width:100%;padding:0}.card{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<header>
  <button class="btn mbtn" onclick="toggleSB()">☰ Tests (93)</button>
  <div class="brand" onclick="showHome()"><span>Civil Lab Academy</span><span class="badge">93 Tests</span></div>
  <div class="sw"><input id="q" type="text" placeholder="Search #, name, AASHTO / ASTM / BS / APHA / ISO..." oninput="onSearch()" /><button id="qc" class="sc" onclick="clrSearch()">✕</button></div>
  <div class="tools">
    <div class="tpill">⏱ <span id="td">00:00</span><button onclick="togTimer()" id="tb">Start</button><button onclick="rstTimer()">Reset</button></div>
    <button class="btn" onclick="showSaved()">📋 Saved (<span id="scnt">0</span>)</button>
    <button class="btn" onclick="togTheme()" id="thb">🌙 Dark</button>
  </div>
</header>
<div class="layout">
  <aside id="sb">
    <div class="pills" id="cpills"></div>
    <select class="subsel" id="ssel" onchange="rList()"></select>
    <div style="font-size:.76rem;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between">
      <span id="lcnt">93 tests</span>
      <label style="cursor:pointer"><input type="checkbox" id="fonly" onchange="rList()"/> Favorites</label>
    </div>
    <div class="tlist" id="tlist"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
const CATS=["Civil Engineering Materials","Field Testing","Geotechnical & Rock","Chemistry","Environmental Monitoring"];

const RAW=[
[1,"Particle size distribution",0,0,"AASHTO T 27 · ASTM C136","Determines aggregate grading curve controlling packing, paste/bitumen demand and workability.","Balance (0.1%)|Woven sieves M 92/E11, lid & pan|Mechanical shaker|Oven 110±5°C|Splitter/quartering|Brushes|Trays","Split/quarter sample (T 2/T 248); min ~300 g fine.|Oven-dry to constant mass & cool.","Weigh dry sample M.|Stack sieves coarsest-top to pan-bottom.|Pour onto top sieve, cover (no overload).|Shake ~10 min (≤1%/min passes).|Weigh retained per sieve; brush underside.|Weigh pan.|Total must be within 0.3% of M (else repeat).|Compute % retained/% passing & plot semi-log curve.","%ret=(M_i/M)×100 | %pass=100−cum%ret | FM=Σ(cum%ret 150µm–9.5mm)/100","Standard & ID|Sieves|Mass retained & % passing|Curve vs spec|Fineness modulus|Date, operator, deviations","Don't push grains through mesh.|Avoid overloaded sieves.|Check torn/stretched mesh.|Wear dust mask for dry fines.","psd","sieve"],
[2,"Fines content",0,0,"AASHTO T 11 · ASTM C117","Measures material <75 µm (silt/clay) by washing, which raises water demand & weakens bond.","Balance (0.1%)|75 µm + 1.18 mm guard sieve|Wash container|Spray nozzle|Oven 110±5°C|Drying pans","Split representative sample.|Oven-dry at 110±5°C, cool & weigh to 0.1%.","Record dry mass B.|Cover with water (wetting agent only if allowed).|Stir well to suspend fines.|Pour muddy water over nested 1.18 mm & 75 µm sieves.|Repeat clean water stir/pour until clear.|Wash residue gently until <75 µm passes.|Return all retained to pan, drain, dry at 110±5°C.|Cool & weigh washed dry mass C.","A(%)=((B−C)/B)×100","Standard & ID|Masses B & C|% <75 µm to 0.1%|Wetting agent used|Date, operator, deviations","Don't splash coarse grains over rim.|Avoid hard jets damaging mesh.|Dry to constant mass.|Higher than dry sieving (removes clay coatings).","loss_bc","wash"],
[3,"Particle density & water absorption",0,0,"AASHTO T 85 / T 84 · ASTM C127 / C128","Finds specific gravity and water absorption of coarse & fine aggregate for volumetric mix design.","Balance (0.5 g, suspended)|Wire basket & 23±2°C tank|500 mL pycnometer & thermometer|SSD cone & tamper|Cloth|Oven 110±5°C","Coarse: wash, dry, soak 24±4 h.|Fine (~1 kg): soak 24±4 h, bring to SSD via cone test, use 500 g.","Coarse: towel-roll to SSD.|Weigh SSD in air B.|Weigh submerged in 23±2°C water C.|Oven-dry, cool, weigh A.|Fine: add 500 g SSD (S) + water to pycnometer.|Roll/shake 15–20 min to de-air.|Adjust 23±2°C to mark, weigh C.|Oven-dry sample, weigh A.|Fill clean pycnometer to mark, weigh B.","Coarse: Gsb=A/(B−C); Gsa=A/(A−C); Abs%=((B−A)/A)×100 | Fine: Gsb=A/(B+S−C) | ρ=Gs×ρ_w","Standard|Bulk OD, SSD & Apparent Gs|Absorption (0.1%)|Water temp|Date, operator, deviations","SSD state is largest error source.|Take full time de-airing.|Keep water temp steady.|Label coarse vs fine method.","sg_agg","pyc"],
[4,"Aggregate crushing value",0,0,"BS 812-110","Measures resistance to gradual compressive crushing; lower ACV = stronger aggregate.","150 mm steel cylinder, base & plunger|400 kN press|Tamping rod|Cylindrical measure|2.36, 10, 14 mm sieves|Balance (1 g)|Oven 105–110°C","Take 14–10 mm fraction, oven-dry & cool.|Fill measure in 3 layers (25 tamps each) & weigh.","Fill cylinder in 3 layers (25 tamps each).|Level & fit plunger squarely.|Centre under press platen.|Load uniformly to 400 kN in 10 min; release.|Sieve entire sample on 2.36 mm.|Weigh passing 2.36 mm (M2) & test mass (M1).|Repeat on second sample.","ACV(%)=(M2/M1)×100","Standard|Type, source & fraction|M1 & M2|Individual & mean ACV (whole #)|Date, operator, deviations","Plunger must sit square.|Stay clear during loading.|Compare with project spec.|Two tests must agree closely.","pct_m2m1","press"],
[5,"Aggregate impact value",0,0,"BS 812-112","Measures resistance to sudden impact; lower AIV = tougher aggregate.","Impact machine (13.5–14 kg hammer, cup)|Balance (1 g)|Tamping rod|Measure|2.36, 10, 14 mm sieves|Oven 105–110°C","Take 14–10 mm fraction, dry & cool.|Fix test mass from 3-layer tamped measure.","Fix base on solid level floor.|Fill cup in 3 layers (25 tamps each).|Centre cup under hammer.|Drop hammer freely from 380 mm height.|Give 15 blows (≥1 s apart).|Sieve on 2.36 mm; weigh passing M2 & sample M1.|Repeat on second sample.","AIV(%)=(M2/M1)×100","Standard|Type, source & fraction|M1 & M2|Each & mean AIV (whole #)|Date, operator, deviations","Keep hands clear.|Verify 380 mm drop height.|Prevent hammer bounce double-hit.|Confirm with duplicate.","pct_m2m1","impact"],
[6,"10% fines value",0,0,"BS 812-111","Finds load (kN) producing 10% fines (<2.36 mm) for softer/porous rock. Higher load = stronger.","ACV cylinder/plunger|≥400 kN press|Tamping rod & measure|2.36, 10, 14 mm sieves|Balance & oven|Water tank (if soaked)","Prepare 14–10 mm dry or 24-h soaked.|Fill cylinder in 3 layers (25 tamps each) & weigh M1.","Pick force expecting 7.5–12.5% fines.|Fill cylinder, fit plunger.|Load uniformly to target force in 10 min.|Sieve on 2.36 mm & weigh M2.|Repeat at 2nd force bracketing 10% fines.|Compute 10% fines force.","Fines%=(M2/M1)×100 | F=14×x/(y+4)","Standard|Type & condition (dry/soaked)|Forces & % fines|Force for 10% fines (nearest 10 kN)|Date, operator, deviations","Bracket 7.5–12.5% fines.|Keep 10 min load time.|Stay clear.|State dry or soaked.","ten_fines","press"],
[7,"Flakiness index",0,0,"BS 812-105.1 · ASTM D4791","Measures % by mass of flat thin particles using a slotted thickness gauge.","Thickness gauge|Sieves 63,50,37.5,28,20,14,10,6.3 mm|Balance (0.1%)|Trays|Oven","Split & dry coarse aggregate ensuring enough grains in largest fraction.","Sieve into fractions; ignore <5% mass fractions.|Sum tested fractions (M1).|Use slot = 0.6 × mean sieve size.|Pass particles edge-on by hand.|Weigh passing flaky particles; sum as M2.","slot=0.6×(up+low)/2 | FI(%)=(M2/M1)×100","Standard (note BS≠ASTM)|ID & fractions|Fraction & flaky masses|FI (whole #)|Date, operator, deviations","Use exact slot.|Present edge-on, don't force.|Must be dry & clean.|Report BS separate from ASTM D4791.","pct_m2m1","gauge"],
[8,"Elongation index",0,0,"BS 812-105.2 · ASTM D4791","Measures % by mass of long thin particles using a pin length gauge.","Pin length gauge|Sieves 63–10 mm|Balance (0.1%)|Trays","Use dried split sample from FI test; ignore <5% fractions.","Sum tested fractions (M1).|Set pins to 1.8 × mean sieve size.|Try passing particles lengthwise between pins.|Set aside retained elongated particles.|Weigh & sum as M2.","opening=1.8×(up+low)/2 | EI(%)=(M2/M1)×100","Standard|ID & fractions|Fraction & retained masses|EI (whole #)|Date, operator, deviations","Particle can be both flaky & elongated.|Check pin setting.|Align longest axis with gap.|Don't combine FI & EI unless asked.","pct_m2m1","gauge"],
[9,"Shape index",0,0,"BS EN 933-4","Finds % of non-cubical particles whose length exceeds 3× their thickness.","Slide caliper (L & E)|Test sieves|Balance (0.1%)|Trays & splitter","Dry coarse aggregate, split to test mass, sieve to narrow fractions.","Weigh dry portion M1.|Discard outside-range fractions.|Measure max length L & min thickness E per particle.|Set aside particles with L > 3E.|Weigh non-cubical particles as M2.","SI(%)=(M2/M1)×100 (L>3E)","Standard|ID & fractions|Total & non-cubical masses|SI (whole #)|Date, operator, deviations","Check caliper on reference block.|Measure smallest thickness.|Use standard sample mass.|Not interchangeable with FI.","pct_m2m1","gauge"],
[10,"LA abrasion",0,0,"AASHTO T 96 · ASTM C131 / C535","Measures aggregate wear & impact loss when tumbled with steel balls in the Los Angeles drum.","LA drum (30–33 rpm)|Steel balls (12/11/8/6 for A–D)|1.70 mm sieve|Balance (1 g)|Oven 110±5°C|Splitter","Wash & dry at 110±5°C.|Recombine into grading A, B, C or D (~5000 g).","Weigh original mass.|Load sample + balls; bolt lid tight.|Run 500 rev at 30–33 rpm.|Remove balls; sieve on 1.70 mm.|Wash retained 1.70 mm, dry to constant mass & weigh.","LA(%)=((orig−final_1.70)/orig)×100","Standard|Source & grading|Balls & revolutions|LA loss (whole #)|Date, operator, deviations","Match grading & ball count.|Bolt lid tight.|Stay clear of running drum.|Compare with spec limit.","la_loss","la"],
[11,"Sodium/magnesium sulphate soundness",0,0,"AASHTO T 104 · ASTM C88","Assesses weathering/freeze-thaw durability via repeated saturated sulphate soak and oven-dry cycles.","Wire baskets|Containers|Saturated Na2SO4 or MgSO4|Hydrometer|Sieves|Oven 110±5°C|Balance","Wash, dry, sieve fractions & weigh.|Cool solution to 21±1°C at standard density.","Weigh each fraction in basket.|Soak 16–18 h at 21±1°C.|Drain 15 min.|Oven-dry at 110±5°C & cool.|Repeat 5 cycles.|Wash sulphate-free (BaCl2 check), dry, sieve on original sieve & weigh.","Loss%=((orig−fin)/orig)×100 | Weighted=Σ(loss%×%grad)/100","Standard|Salt & cycles|Fraction & weighted loss|Cracking/flaking notes|Date, operator, deviations","Hold 21±1°C.|No basket contact.|Wear PPE for irritant salts.|Use heat gloves.","la_loss","soundness"],
[12,"Shell content",0,0,"BS EN 933-7","Determines % of weak shell fragments in coarse marine aggregate.","Balance (0.1%)|4 mm sieve|Oven 110±5°C|Tweezers & trays|Splitter|Bright light & magnifier","Split coarse sample; dry at 110±5°C & cool.","Weigh dry portion M1.|Sieve on 4 mm; keep retained.|Spread small batches under bright light.|Hand-pick whole & broken shells.|Weigh shells as M2.","SC(%)=(M2/M1)×100","Standard|ID & portion size|Shell & portion masses|Shell % (0.1%)|Date, operator, deviations","Define shell fragments beforehand.|Sort small amounts.|Use bright light.|Note whole vs broken shells.","pct_m2m1","bal_oven"],
[13,"Bulk density & voids",0,0,"AASHTO T 19 · ASTM C29","Finds unit weight and void % of aggregate for mass-volume mix conversions.","Calibrated cylindrical measure|16 mm tamping rod|Strike-off bar|Scoop|Balance (0.05 kg)|Oven & glass plate","Dry aggregate & cool.|Calibrate measure volume V with water.","Weigh empty measure T.|Rodded: fill in 3 thirds, tamp 25× each, strike flush, weigh G.|Loose: shovel from ≤50 mm height, strike flush, weigh G.|Repeat on 2nd sample.","M=(G−T)/V | Voids%=((S×W−M)/(S×W))×100","Standard|Type, size & condition|Method (rodded/jigged/loose)|Bulk density (10 kg/m³) & voids %|Date, operator, deviations","Don't shake measure.|Don't hit bottom hard.|Use consistent method.|Use standard measure size.","bulk_voids","measure"],
[14,"Clay lumps & friable particles",0,0,"AASHTO T 112 · ASTM C142","Finds weak particles that crumble in mixes and cause concrete pop-outs.","Balance (0.1%)|Residue sieves|Soaking pans|Gentle spray|Oven 110±5°C","Split fractions (~25 g fine >1.18 mm) & dry at 110±5°C.","Weigh fraction W.|Cover thinly with distilled water; soak 24±4 h.|Squeeze particles between thumb & forefinger.|Wet-sieve broken fines off.|Dry retained residue at 110±5°C & weigh R.","P(%)=((W−R)/W)×100 | P_tot=Σ(P%×%grad)/100","Standard|ID & fractions|% per fraction & total|Date, operator, deviations","Consistent finger pressure.|No hard jet.|Use distilled water.|Dry to constant mass.","clay_lumps","wash"],

let sieveRows = [
  {sz:25,m:0},{sz:19,m:42},{sz:12.5,m:98},{sz:9.5,m:85},{sz:4.75,m:145},
  {sz:2.36,m:110},{sz:1.18,m:82},{sz:0.60,m:56},{sz:0.30,m:41},{sz:0.15,m:24},{sz:0.075,m:11},{sz:0,m:6}

function renderSievePlotter(tid){

          </tr>`).join("")}

function updSieve(tid){
  const M=parseFloat(document.getElementById("sv_M").value)||0;
  const tot=sieveRows.reduce((s,r)=>s+r.m,0);
  const base=M>0?M:tot||1;
  let cum=0, pts=[];
  const fmSizes=[9.5,4.75,2.36,1.18,0.6,0.3,0.15];
  let fmSum=0;
  sieveRows.forEach((r,i)=>{
    const pr=(r.m/base)*100; cum+=pr; const pp=Math.max(0,100-cum);
    document.getElementById("sv_pr_"+i).textContent=pr.toFixed(1)+"%";
    document.getElementById("sv_cr_"+i).textContent=cum.toFixed(1)+"%";
    document.getElementById("sv_pp_"+i).textContent=pp.toFixed(1)+"%";
    if(r.sz>0){pts.push({sz:r.sz,pp}); if(fmSizes.includes(r.sz))fmSum+=cum;}
  });
  const diff=M>0?Math.abs(tot-M)/M*100:0;
  const tol=tid===40?1.0:0.3;
  function interpD(target){
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      if((a.pp>=target&&b.pp<=target)||(a.pp<=target&&b.pp>=target)){
        if(a.pp===b.pp)return a.sz;
        const f=(target-b.pp)/(a.pp-b.pp);
        return Math.pow(10,Math.log10(b.sz)+f*(Math.log10(a.sz)-Math.log10(b.sz)));
      }
    }
    return null;
  }
  const d10=interpD(10),d30=interpD(30),d60=interpD(60);
  const cu=(d10&&d60)?(d60/d10).toFixed(2):"-", cc=(d10&&d30&&d60)?(d30*d30/(d10*d60)).toFixed(2):"-";
  const txt=`Sum = ${tot.toFixed(1)} g (Loss/Diff: ${diff.toFixed(2)}% ${diff<=tol?'✓ OK':'⚠ Exceeds '+tol+'%'}) | FM = ${(fmSum/100).toFixed(2)} | D10=${d10?d10.toFixed(2):'-'} D30=${d30?d30.toFixed(2):'-'} D60=${d60?d60.toFixed(2):'-'} | Cu=${cu} Cc=${cc}`;
  document.getElementById("sv_sum").textContent=txt;
  state.lastCalc[tid]=txt;

  // Draw Semi-Log SVG
  const W=600,H=260,pl=48,pr=20,pt=16,pb=36,pw=W-pl-pr,ph=H-pt-pb;
  const lmin=Math.log10(0.05), lmax=Math.log10(50);
  const xOf=(sz)=>pl+((Math.log10(sz)-lmin)/(lmax-lmin))*pw;
  const yOf=(p)=>pt+(1-p/100)*ph;
  let g=`<rect x="${pl}" y="${pt}" width="${pw}" height="${ph}" fill="none" stroke="var(--border)"/>`;
  [0,20,40,60,80,100].forEach(p=>{const y=yOf(p);g+=`<line x1="${pl}" y1="${y}" x2="${pl+pw}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${p}%</text>`;});
  [0.075,0.15,0.3,0.6,1.18,2.36,4.75,9.5,19,37.5].forEach(sz=>{const x=xOf(sz);g+=`<line x1="${x}" y1="${pt}" x2="${x}" y2="${pt+ph}" stroke="var(--border)" stroke-dasharray="2 3"/><text x="${x}" y="${pt+ph+14}" text-anchor="middle" font-size="9" fill="var(--muted)">${sz}</text>`;});
  g+=`<text x="${pl+pw/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">Sieve Size (mm, log scale)</text>`;
  const poly=pts.map(p=>`${xOf(p.sz).toFixed(1)},${yOf(p.pp).toFixed(1)}`).join(" ");
  g+=`<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${poly}"/>`;
  pts.forEach(p=>{g+=`<circle cx="${xOf(p.sz).toFixed(1)}" cy="${yOf(p.pp).toFixed(1)}" r="3.5" fill="var(--accent)"/>`;});
  document.getElementById("sv_svg").innerHTML=g;
}

let proctorPts = [
  {mms:5820,w:8.2},{mms:5975,w:10.4},{mms:6105,w:12.6},{mms:6085,w:14.8},{mms:5980,w:17.1}

function renderProctorPlotter(tid){
  return `<div class="ccard">
    <div style="font-weight:700;margin-bottom:6px">Proctor Compaction Curve &amp; Zero Air Voids (ZAV) Plotter</div>
    <div class="cgrid" style="margin-bottom:8px">
      <div class="fld"><label>Empty Mould M_m (g)</label><input id="pr_Mm" type="number" step="any" value="4180" oninput="updProctor(${tid})"/></div>
      <div class="fld"><label>Mould Volume V (cm³)</label><input id="pr_V" type="number" step="any" value="943" oninput="updProctor(${tid})"/></div>

    </div>

      <table class="ptbl">
        <thead><tr><th>Point</th><th>Mould + Soil M_ms (g)</th><th>Moisture w (%)</th><th>Wet ρ (Mg/m³)</th><th>Dry ρ_d (Mg/m³)</th><th>ZAV (Mg/m³)</th></tr></thead>
        <tbody>
          ${proctorPts.map((p,i)=>`<tr>
            <td>#${i+1}</td>

            <td><input type="number" step="any" value="${p.w}" oninput="proctorPts[${i}].w=parseFloat(this.value)||0;updProctor(${tid})"/></td>
            <td id="pr_rw_${i}">-</td><td id="pr_rd_${i}">-</td><td id="pr_zv_${i}">-</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="cres" id="pr_sum"></div>
    <div class="chartbox"><svg id="pr_svg" viewBox="0 0 600 260"></svg></div>
  </div>`;

function updProctor(tid){
  const Mm=parseFloat(document.getElementById("pr_Mm").value)||0;
  const V=parseFloat(document.getElementById("pr_V").value)||1;
  const Gs=parseFloat(document.getElementById("pr_Gs").value)||2.68;
  const pts=[];
  proctorPts.forEach((p,i)=>{
    const rw=(p.mms-Mm)/V, rd=rw/(1+p.w/100), zv=Gs/(1+p.w*Gs/100);
    document.getElementById("pr_rw_"+i).textContent=rw.toFixed(3);
    document.getElementById("pr_rd_"+i).textContent=rd.toFixed(3);
    document.getElementById("pr_zv_"+i).textContent=zv.toFixed(3);
    pts.push({w:p.w,rd,zv});
  });
  pts.sort((a,b)=>a.w-b.w);
  // Fit parabola around top 3 points for peak estimate
  let best=pts.reduce((a,b)=>b.rd>a.rd?b:a,pts[0]), mdd=best.rd, omc=best.w;
  const idx=pts.indexOf(best);
  if(idx>0&&idx<pts.length-1){
    const p1=pts[idx-1],p2=pts[idx],p3=pts[idx+1];
    const denom=(p1.w-p2.w)*(p1.w-p3.w)*(p2.w-p3.w);
    if(Math.abs(denom)>1e-9){
      const A=(p3.w*(p2.rd-p1.rd)+p2.w*(p1.rd-p3.rd)+p1.w*(p3.rd-p2.rd))/denom;
      const B=(p3.w*p3.w*(p1.rd-p2.rd)+p2.w*p2.w*(p3.rd-p1.rd)+p1.w*p1.w*(p2.rd-p3.rd))/denom;
      if(A<0){const vx=-B/(2*A);const vy=A*vx*vx+B*vx+(p1.rd-A*p1.w*p1.w-B*p1.w);if(vy>=best.rd){omc=vx;mdd=vy;}}
    }
  }
  const resTxt=`Estimated MDD = ${mdd.toFixed(2)} Mg/m³ | OMC = ${omc.toFixed(1)} %`;
  document.getElementById("pr_sum").textContent=resTxt;
  state.lastCalc[tid]=resTxt;

  // Draw SVG
  const W=600,H=260,pl=54,pr=20,pt=16,pb=36,pw=W-pl-pr,ph=H-pt-pb;
  const wmin=Math.max(0,Math.floor(pts[0].w-2)), wmax=Math.ceil(pts[pts.length-1].w+2);
  const allY=pts.map(p=>p.rd).concat([mdd]);
  const ymin=Math.floor((Math.min(...allY)-0.08)*20)/20, ymax=Math.ceil((Math.max(...allY,pts[0].zv*0.98)+0.06)*20)/20;
  const xOf=(w)=>pl+((w-wmin)/(wmax-wmin))*pw;
  const yOf=(d)=>pt+(1-(d-ymin)/(ymax-ymin))*ph;
  let g=`<rect x="${pl}" y="${pt}" width="${pw}" height="${ph}" fill="none" stroke="var(--border)"/>`;
  for(let k=0;k<=5;k++){const d=ymin+k*(ymax-ymin)/5,y=yOf(d);g+=`<line x1="${pl}" y1="${y}" x2="${pl+pw}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${d.toFixed(2)}</text>`;}
  for(let w=wmin;w<=wmax;w+=2){const x=xOf(w);g+=`<line x1="${x}" y1="${pt}" x2="${x}" y2="${pt+ph}" stroke="var(--border)" stroke-dasharray="2 3"/><text x="${x}" y="${pt+ph+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${w}%</text>`;}
  g+=`<text x="${pl+pw/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">Moisture Content w (%)</text>`;
  // ZAV curve
  const zavPts=[];for(let w=wmin;w<=wmax;w+=0.5){const z=Gs/(1+w*Gs/100);if(z>=ymin&&z<=ymax)zavPts.push(`${xOf(w).toFixed(1)},${yOf(z).toFixed(1)}`);}
  if(zavPts.length>1)g+=`<polyline fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" points="${zavPts.join(" ")}"/>`;
  // Compaction curve
  g+=`<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${pts.map(p=>`${xOf(p.w).toFixed(1)},${yOf(p.rd).toFixed(1)}`).join(" ")}"/>`;
  pts.forEach(p=>{g+=`<circle cx="${xOf(p.w).toFixed(1)}" cy="${yOf(p.rd).toFixed(1)}" r="4" fill="var(--accent)"/>`;});
  // Peak crosshair
  const px=xOf(omc),py=yOf(mdd);
  g+=`<line x1="${px}" y1="${py}" x2="${px}" y2="${pt+ph}" stroke="var(--ok)" stroke-dasharray="4 3"/><line x1="${pl}" y1="${py}" x2="${px}" y2="${py}" stroke="var(--ok)" stroke-dasharray="4 3"/><circle cx="${px}" cy="${py}" r="5" fill="var(--ok)"/><text x="${Math.min(px+8,pl+pw-115)}" y="${Math.max(py-6,pt+14)}" font-size="11" font-weight="700" fill="var(--ok)">MDD ${mdd.toFixed(2)} @ ${omc.toFixed(1)}%</text>`;
  document.getElementById("pr_svg").innerHTML=g;
}

      const hay=`${t.id} ${t.title} ${t.std} ${t.cat} ${t.sub} ${t.desc} ${t.equip.join(" ")}`.toLowerCase();
      if(!hay.includes(state.q))return false;
    }
    return true;
  });
}

function rList(){
  const list=getFiltered();
  document.getElementById("lcnt").textContent=`${list.length} of 93 tests`;
  document.getElementById("tlist").innerHTML=list.map(t=>`
    <div class="titem ${state.sel===t.id?'active':''}" onclick="selectTest(${t.id})">
      <div class="tnum">${t.id}</div>
      <div class="tmeta">
        <div class="ttitle">${state.fav.includes(t.id)?'★ ':''}${esc(t.title)}</div>
        <div class="tstd">${esc(t.std)}</div>
      </div>
    </div>`).join("")||`<div style="padding:14px;color:var(--muted);font-size:.85rem">No matching tests found.</div>`;
}

function showHome(){
  state.sel=null; rList();
  const counts=CATS.map((c,i)=>({c,i,n:TESTS.filter(t=>t.catIdx===i).length}));
  document.getElementById("main").innerHTML=`
    <div class="card">
      <h1 class="title">Civil Lab Academy — Complete Test Procedures</h1>
      <p style="color:var(--muted);margin:4px 0 14px">Interactive lab companion for all <strong>93 AASHTO / ASTM / BS / APHA / ISO</strong> civil engineering, geotechnical, chemistry &amp; environmental tests.</p>
      <div class="dgrid">${counts.map(x=>`<div class="scard" onclick="setCat(${x.i});selectTest(${TESTS.find(t=>t.catIdx===x.i).id})"><div class="sval">${x.n}</div><div class="slbl">${esc(x.c)}</div></div>`).join("")}</div>
      <div class="sh">Quick Start</div>
      <ul style="margin:4px 0;padding-left:20px;font-size:.9rem">
        <li>Click any test in the sidebar or search by number (e.g. <code>92</code>), test name, or standard (<code>ASTM D1557</code>, <code>BS 812</code>, <code>APHA</code>).</li>
        <li>Use <strong>Procedure</strong> checkboxes to track steps on the bench, and the header <strong>Stopwatch</strong> for timed steps.</li>
        <li>Open <strong>Calculations</strong> for live test calculators (plus multi-sieve grading curve &amp; Proctor MDD/OMC plotters), then save or print in <strong>Report</strong>.</li>
      </ul>
      <div class="disc">For learning &amp; lab guidance. Always follow the current edition of the standard and your project specification.</div>
    </div>`;
}

function selectTest(id){
  state.sel=id;
  document.getElementById("sb").classList.remove("open");
  rList();
  renderTest();
}
function setTab(tb){state.tab=tb;renderTest();}
function togFav(id){
  const idx=state.fav.indexOf(id);
  if(idx>=0)state.fav.splice(idx,1);else state.fav.push(id);
  localStorage.setItem(LS_FAV,JSON.stringify(state.fav));
  rList();renderTest();
}
function togChk(tid,grp,i){
  const k=`${tid}_${grp}_${i}`;
  state.chk[k]=!state.chk[k];
  localStorage.setItem(LS_CHK,JSON.stringify(state.chk));
  renderTest();
}
function clrChk(tid){
  Object.keys(state.chk).forEach(k=>{if(k.startsWith(`${tid}_`))delete state.chk[k];});
  localStorage.setItem(LS_CHK,JSON.stringify(state.chk));
  renderTest();
}
function renderChecks(tid,grp,items){
  return `<ul class="clist">`+items.map((it,i)=>{
    const d=!!state.chk[`${tid}_${grp}_${i}`];
    return `<li class="${d?'done':''}"><input type="checkbox" ${d?'checked':''} onchange="togChk(${tid},'${grp}',${i})"/><span>${esc(it)}</span></li>`;
  }).join("")+`</ul>`;
}

function renderTest(){
  const t=TESTS.find(x=>x.id===state.sel); if(!t)return;
  const fav=state.fav.includes(t.id);
  const doneSteps=t.steps.filter((_,i)=>state.chk[`${t.id}_s_${i}`]).length;
  const pct=Math.round(doneSteps/t.steps.length*100);
  let body="";

  if(state.tab==="overview"){
    body=`
      <div class="sbox">${getSVG(t)}</div>
      <div class="sh">What it determines</div>
      <p style="margin:4px 0 10px">${esc(t.desc)}</p>
      <div class="sh">Equipment (${t.equip.length})</div>
      ${renderChecks(t.id,'e',t.equip)}
      <div class="sh">Sample &amp; Preparation</div>
      ${renderChecks(t.id,'p',t.prep)}
      <div class="sh">Precautions &amp; Common Mistakes</div>
      <div class="wbox"><ul>${t.prec.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  } else if(state.tab==="procedure"){
    body=`
      <div class="sh"><span>Step-by-Step Procedure (${doneSteps}/${t.steps.length} done)</span><button class="btn" onclick="clrChk(${t.id})">Reset checks</button></div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
      ${renderChecks(t.id,'s',t.steps.map((s,i)=>`${i+1}. ${s}`))}
      <div class="sh">Precautions</div>
      <div class="wbox"><ul>${t.prec.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  } else if(state.tab==="calc"){
    const c=CALCS[t.cid];
    let extra="";
    if(t.id===1||t.id===26||t.id===40) extra=renderSievePlotter(t.id);
    if(t.id===92||t.id===93) extra=renderProctorPlotter(t.id);
    body=`
      <div class="sh">Standard Formula</div>
      <div class="fcode">${esc(t.formula)}</div>
      ${extra}
      <div class="ccard">
        <div style="font-weight:700;margin-bottom:8px">Calculator — ${esc(c[0])}</div>
        <div class="cgrid">${c[1].map(f=>`<div class="fld"><label>${esc(f[1])}</label><input id="ci_${f[0]}" type="${typeof f[2]==='string'?'text':'number'}" step="any" value="${esc(f[2])}" oninput="runCalc(${t.id})"/></div>`).join("")}</div>
        <div class="cres" id="cres"></div>
      </div>`;
  } else if(state.tab==="report"){
    const prev=state.lastCalc[t.id]||"";
    body=`
      <div class="sh">What to Report Checklist</div>
      ${renderChecks(t.id,'r',t.report)}
      <div class="sh">Lab Test Report Form</div>
      <div class="cgrid">
        <div class="fld"><label>Project Name</label><input id="rp_proj" placeholder="e.g. NHA Highway Package-II"/></div>
        <div class="fld"><label>Sample ID / Borehole</label><input id="rp_sid" placeholder="e.g. BH-04 / Stockpile A"/></div>
        <div class="fld"><label>Location / Chainage / Depth</label><input id="rp_loc" placeholder="e.g. Km 14+200, Subbase"/></div>
        <div class="fld"><label>Operator</label><input id="rp_op" placeholder="Lab Technician"/></div>
        <div class="fld"><label>Test Date</label><input id="rp_dt" type="date" value="${new Date().toISOString().slice(0,10)}"/></div>
        <div class="fld"><label>Computed / Measured Result</label><input id="rp_res" value="${esc(prev)}" placeholder="Run Calculator tab or enter result"/></div>
      </div>
      <div class="fld" style="margin-top:8px"><label>Observations / Deviations</label><textarea id="rp_obs" rows="3" placeholder="Condition, failures, deviations from standard..."></textarea></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap" class="np">
        <button class="btn pri" onclick="saveRep(${t.id})">💾 Save Report</button>
        <button class="btn" onclick="window.print()">🖨 Print / Save PDF</button>
      </div>`;
  }

  document.getElementById("main").innerHTML=`
    <div class="card">
      <div class="bc">${esc(t.cat)} › ${esc(t.sub)} · Test #${t.id}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <h1 class="title">${t.id}. ${esc(t.title)}</h1>
        <button class="btn np" onclick="togFav(${t.id})">${fav?'★ Favorited':'☆ Favorite'}</button>
      </div>
      <div class="tags"><span class="stag">${esc(t.std)}</span></div>
      <div class="tabs np">
        <button class="tab ${state.tab==='overview'?'active':''}" onclick="setTab('overview')">Overview &amp; Prep</button>
        <button class="tab ${state.tab==='procedure'?'active':''}" onclick="setTab('procedure')">Procedure (${doneSteps}/${t.steps.length})</button>
        <button class="tab ${state.tab==='calc'?'active':''}" onclick="setTab('calc')">Calculations</button>
        <button class="tab ${state.tab==='report'?'active':''}" onclick="setTab('report')">Report &amp; Print</button>
      </div>
      ${body}
      <div class="disc">For learning &amp; reference. Always follow the current standard edition and project specification.</div>
    </div>`;
  if(state.tab==="calc"){
    runCalc(t.id);
    if(t.id===1||t.id===26||t.id===40)updSieve(t.id);
    if(t.id===92||t.id===93)updProctor(t.id);
  }
}

function runCalc(tid){
  const t=TESTS.find(x=>x.id===tid), c=CALCS[t.cid], v={};
  c[1].forEach(f=>{const raw=document.getElementById("ci_"+f[0]).value;v[f[0]]=typeof f[2]==="string"?raw:parseFloat(raw);});
  let out="";
  try{out=c[2](v);}catch(e){out="Check input values.";}
  if(out.includes("NaN")||out.includes("Infinity"))out="Enter valid non-zero values.";
  document.getElementById("cres").textContent=out;
  if(!((tid===1||tid===26||tid===40||tid===92||tid===93)&&state.lastCalc[tid]))state.lastCalc[tid]=out;
}

function saveRep(tid){
  const t=TESTS.find(x=>x.id===tid);
  const rec={
    testId:t.id, test:t.title, std:t.std,
    proj:document.getElementById("rp_proj").value,
    sid:document.getElementById("rp_sid").value,
    loc:document.getElementById("rp_loc").value,
    op:document.getElementById("rp_op").value,
    dt:document.getElementById("rp_dt").value,
    res:document.getElementById("rp_res").value,
    obs:document.getElementById("rp_obs").value,
    savedAt:new Date().toLocaleString()
  };
  state.reps.unshift(rec);
  localStorage.setItem(LS_REP,JSON.stringify(state.reps));
  updSavedCnt();
  alert("Report saved! View it anytime under 'Saved' in the top bar.");
}
function updSavedCnt(){document.getElementById("scnt").textContent=state.reps.length;}

function showSaved(){
  state.sel=null; rList();
  document.getElementById("main").innerHTML=`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h1 class="title">Saved Lab Reports (${state.reps.length})</h1>
        <div style="display:flex;gap:8px" class="np">
          <button class="btn" onclick="exportReps()">⬇ Export JSON</button>
          <button class="btn" onclick="window.print()">🖨 Print</button>
          <button class="btn" onclick="showHome()">← Back</button>
        </div>
      </div>
      ${state.reps.length?state.reps.map((r,i)=>`
        <div class="ccard">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <strong>#${r.testId} ${esc(r.test)} <span style="color:var(--muted);font-weight:400">(${esc(r.std)})</span></strong>
            <button class="btn np" onclick="delRep(${i})">Delete</button>
          </div>
          <div style="font-size:.84rem;color:var(--muted);margin:4px 0">Project: ${esc(r.proj||'-')} · Sample: ${esc(r.sid||'-')} · Loc: ${esc(r.loc||'-')} · Date: ${esc(r.dt||'-')} · Op: ${esc(r.op||'-')}</div>
          <div style="font-weight:600;color:var(--primary)">Result: ${esc(r.res||'-')}</div>
          ${r.obs?`<div style="font-size:.84rem;margin-top:3px">Notes: ${esc(r.obs)}</div>`:''}
        </div>`).join(""):`<p style="color:var(--muted)">No saved reports yet. Open any test → Report &amp; Print tab to save one.</p>`}
    </div>`;
}
function delRep(i){state.reps.splice(i,1);localStorage.setItem(LS_REP,JSON.stringify(state.reps));updSavedCnt();showSaved();}
function exportReps(){
  const b=new Blob([JSON.stringify(state.reps,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="civil-lab-reports.json";a.click();
}

document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();document.getElementById("q").focus();}
  if(e.key==="Escape")document.getElementById("sb").classList.remove("open");
});

renderPills(); rList(); updSavedCnt(); showHome();
</script>
</body>
</html>
